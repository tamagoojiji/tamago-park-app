<!doctype html>

    <meta charset="UTF-8" />
    <script>
      // 起動時エラー監視（本体JSより先に動く）。画面が出る前のエラー・読み込み失敗・15秒以上の停止を報告する。
      // React起動後（#boot-loading が消えた後）は main.tsx の報告に任せる。
      (function(){
        var ENDPOINT = 'https://api.tamago-ai-world.com/error-report', sent = {};
        function booting(){ return document.readyState === 'loading' || !!document.getElementById('boot-loading'); }
        function send(message, source, lineno, colno, stack){
          var key = message + '|' + source + '|' + lineno;
          if (sent[key]) return;
          sent[key] = 1;
          var home = navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
          try {
            fetch(ENDPOINT, {
              method: 'POST', keepalive: true, headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ message: '[起動時]' + (home ? '[ホーム画面]' : '') + ' ' + message, source: source, lineno: lineno, colno: colno, stack: stack, url: location.href, userAgent: navigator.userAgent })
            }).catch(function(){});
          } catch (e) {}
        }
        window.addEventListener('error', function(e){
          if (!booting()) return;
          var t = e.target;
          if (t && t !== window) {
            var u = t.src || t.href;
            if (u && u.indexOf(location.origin) === 0) send('読み込み失敗: ' + u, t.tagName);
            return;
          }
          send(String(e.message), e.filename, e.lineno, e.colno, e.error && e.error.stack);
        }, true);
        window.addEventListener('unhandledrejection', function(e){
          if (!booting()) return;
          var r = e.reason;
          send('Promise: ' + ((r && r.message) || String(r)), undefined, undefined, undefined, r && r.stack);
        });
        setTimeout(function(){
          if (document.getElementById('boot-loading')) send('起動タイムアウト: 15秒経っても画面が表示されない', 'boot-watchdog');
        }, 15000);
      })();
    </script>

    <!-- GitHub Pages SPA redirect handler -->
    <script>
      (function(){
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
      })();
